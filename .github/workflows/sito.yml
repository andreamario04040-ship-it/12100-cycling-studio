# Ricostruisce la rastrelliera da data/bici.json e pubblica il sito su GitHub Pages.
# Parte a ogni modifica su main: sia quelle fatte a mano, sia quelle che arrivano
# dal pannello di gestione delle bici.
name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # per salvare index.html rigenerato
  pages: write
  id-token: write

# Una pubblicazione per volta, in coda: se arrivano due bici di fila, nessuna si perde.
concurrency:
  group: pubblica-sito
  cancel-in-progress: false

jobs:
  pubblica:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pubblicazione.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ricostruisci le schede delle bici
        run: python3 tools/costruisci.py

      - name: Salva index.html se è cambiato
        run: |
          if [ -z "$(git status --porcelain index.html data/pubblicato.json)" ]; then
            echo "index.html è già allineato a data/bici.json"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/pubblicato.json
          git commit -m 'Rastrelliera: rigenera le schede da data/bici.json'
          git push

      - name: Prepara i file da pubblicare
        run: |
          mkdir -p _sito
          rsync -a --exclude '.git' --exclude '.github' --exclude 'tools' \
                   --exclude '_sito' --exclude '.DS_Store' ./ _sito/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sito
      - id: pubblicazione
        uses: actions/deploy-pages@v4
